services:
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["data:/app/data", "models:/root/.cache/huggingface"]
    depends_on: [redis]
  ui:
    build: .
    command: streamlit run ui.py --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  data:
  models:
